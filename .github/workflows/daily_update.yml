name: Denní update portfolia a cen

on:
  schedule:
    # Opakované pokusy během dne (UTC), každý den včetně víkendu.
    # Když Yahoo ještě nemá kompletní data, skript nic neuloží a zkusí se to znovu.
    - cron: '0 6,12,15,18,21 * * *'
  workflow_dispatch: # Umožňuje spustit skript kdykoliv ručně tlačítkem na webu

permissions:
  contents: write # nutné pro push změn zpět do repozitáře

concurrency:
  group: portfolio-update
  cancel-in-progress: false # druhý běh počká na dokončení prvního

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Stažení repozitáře
        uses: actions/checkout@v4

      - name: 2. Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalace potřebných knihoven
        run: pip install pandas yfinance

      - name: 4. Spuštění skriptu
        run: python update_data.py

      - name: 5. Commit a push změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_final.json prices_history_final.json
          if git diff --cached --quiet; then
            echo "Žádné změny k uložení."
            exit 0
          fi
          git commit -m "Denní update dat $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push selhal, pokus $i, zkusím znovu..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push se nepodařil ani po 3 pokusech."
          exit 1

name: Denní update portfolia a cen

on:
  schedule:
    # Spustí se každý den v 6:00 UTC (ráno)
    - cron: '0 6 * * *'
  workflow_dispatch: # Umožňuje spustit skript kdykoliv ručně tlačítkem na webu

permissions:
  contents: write # nutné pro push změn zpět do repozitáře

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Stažení repozitáře
        uses: actions/checkout@v4

      - name: 2. Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalace potřebných knihoven
        run: pip install pandas yfinance

      - name: 4. Spuštění skriptu
        run: python update_data.py

      - name: 5. Commit a push změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_final.json prices_history_final.json
          if git diff --cached --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "Denní update dat $(date -u +'%Y-%m-%d')"
            git push
          fi
